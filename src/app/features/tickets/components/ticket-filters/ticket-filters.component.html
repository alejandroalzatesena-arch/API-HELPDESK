<div class="card filters-card">
  <form [formGroup]="filtersForm">
    <div class="filters-row">
      <div class="form-group filters-group">
        <label class="form-label" for="filter-status">Estado</label>
        <select id="filter-status" class="form-control" formControlName="status">
          <option value="">Todos</option>
          <option *ngFor="let status of statusOptions" [value]="status">{{ status }}</option>
        </select>
      </div>

      <div class="form-group filters-group">
        <label class="form-label" for="filter-priority">Prioridad</label>
        <select id="filter-priority" class="form-control" formControlName="priority">
          <option value="">Todas</option>
          <option *ngFor="let priority of priorityOptions" [value]="priority">{{ priority }}</option>
        </select>
      </div>

      <div class="form-group filters-actions">
        <button class="btn btn-outline" type="button" (click)="reset()">Limpiar filtros</button>
      </div>
    </div>
  </form>
</div>
